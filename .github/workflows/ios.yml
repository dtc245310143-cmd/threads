name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ThreadsStudio/**', 'Native/**', 'Tests/**', 'scripts/**', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select available Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Test Threads parser
        run: node Tests/scan.test.cjs
      - name: Fetch verified voice model and reference
        run: python3 scripts/prepare_voice_assets.py
      - name: Restore native voice library cache
        id: voice-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Native/build/iphonesimulator/libStudioVoice.a
            Native/build/iphoneos/libStudioVoice.a
            Native/build/iphonesimulator/source.sha256
            Native/build/iphoneos/source.sha256
            ThreadsStudio/Library/voice/licenses
          key: studio-vieneu-xcode26-6-${{ runner.arch }}-${{ hashFiles('Native/CMakeLists.txt', 'Native/VoiceBridge.cpp', 'Native/VoiceBridge.h', 'scripts/build_voice.sh') }}
      - name: Build native VieNeu for Simulator
        timeout-minutes: 20
        run: |
          set -o pipefail
          bash scripts/build_voice.sh iphonesimulator 2>&1 | tee native.log
      - name: Build native VieNeu for iPhone
        timeout-minutes: 20
        run: |
          set -o pipefail
          bash scripts/build_voice.sh iphoneos 2>&1 | tee native-device.log
      - name: Generate project
        run: python3 scripts/generate_project.py
      - name: Save compiled voice libraries
        if: steps.voice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Native/build/iphonesimulator/libStudioVoice.a
            Native/build/iphoneos/libStudioVoice.a
            Native/build/iphonesimulator/source.sha256
            Native/build/iphoneos/source.sha256
            ThreadsStudio/Library/voice/licenses
          key: ${{ steps.voice-cache.outputs.cache-primary-key }}
      - name: Pick iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/studio-devices.json
          python3 - <<'PY'
          import json, os
          devices=json.load(open('/tmp/studio-devices.json'))['devices']
          iphones=[d for runtime,group in devices.items() if '.iOS-' in runtime for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not iphones: raise SystemExit('No iPhone simulator installed')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('STUDIO_SIMULATOR='+iphones[0]['udid']+'\n')
          PY
      - name: Boot iPhone simulator
        timeout-minutes: 12
        run: |
          xcrun simctl boot "$STUDIO_SIMULATOR" || true
          xcrun simctl bootstatus "$STUDIO_SIMULATOR" -b
      - name: Compile native app and tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ThreadsStudio.xcodeproj -scheme ThreadsStudio \
            -destination "platform=iOS Simulator,id=$STUDIO_SIMULATOR" -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES | tee compile.log
      - name: Native tests and actual MP4 export
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test-without-building -project ThreadsStudio.xcodeproj -scheme ThreadsStudio \
            -destination "platform=iOS Simulator,id=$STUDIO_SIMULATOR" -derivedDataPath build-simulator \
            -parallel-testing-enabled NO -resultBundlePath test-results.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee test.log
      - name: Build unsigned arm64 IPA
        run: bash scripts/build_ipa.sh | tee build.log
      - name: Preview native app
        continue-on-error: true
        run: |
          xcrun simctl launch "$STUDIO_SIMULATOR" com.threads.studio.local
          sleep 3
          xcrun simctl io "$STUDIO_SIMULATOR" screenshot dist/iPhone-preview.png
          container=$(xcrun simctl get_app_container "$STUDIO_SIMULATOR" com.threads.studio.local data)
          if [ -f "$container/Documents/native-voice-test.wav" ]; then cp "$container/Documents/native-voice-test.wav" dist/native-voice-test.wav; fi
      - name: Download IPA here
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsStudio-iPhone-unsigned
          path: |
            dist/ThreadsStudio.ipa
            dist/ThreadsStudio.ipa.sha256
            dist/iPhone-preview.png
            dist/native-voice-test.wav
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-diagnostics
          path: |
            test.log
            compile.log
            native.log
            native-device.log
            build.log
            test-results.xcresult
          if-no-files-found: ignore
          retention-days: 7
